<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-List-Project</title>
    <link rel="stylesheet" href="./css/app.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body onload="getDataFromLocalStorage()">
    
    <div class="container">
      <div class="container__header">
        <h2 class="header__text">تودو لیست</h2>
        <button class="btn__theme-toggle">
         <i class="fa-solid fa-sun"></i>
        </button>
      </div>
      <!--box-todo-list-->
      <div class="container__main">
        <div class="main__header">
         <div class="dropdown__all">
           <button class="btn__all" data-status="all">
            <span class="btn__all-text">همه</span>
            <i class="fa-solid fa-greater-than"></i>
          </button>
          <ul class="dropdown__list hidden">
            <li class="dropdown__item" data-status="all">همه</li>
            <li class="dropdown__item" data-status="complete">تکمیل شده ها</li>
            <li class="dropdown__item" data-status="notcomplete">تکمیل نشده ها</li>
          </ul>
         </div>
          <button class="btn-open__modal">
            <i class="fa-solid fa-plus"></i>
            ایجاد تودو
          </button>
        </div>
        <section class="todos__container">
        </section>
  
      <!--modal-screen-->
      <div class="modal__screen hidden">
        <div class="modal">
          <div class="modal__header">
            <span class="modal-header__text">ایجاد تودو</span>
            <button class="modal-btn__close">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="modal__main">
            <input
              type="text"
              placeholder="عنوان تودو را وارد نمائید ..."
              class="input"
            />
          </div>
          <div class="modal__footer">
            <button class="modal-btn__create">تایید</button>
            <button class="modal-btn__cancel">انصراف</button>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/app.js"></script>
  </body>
</html>
